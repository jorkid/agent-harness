[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "从零实现的最小可用 Agent Runtime（Agent Harness）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.18,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
